services:
  pfdb:
    image: bianjp/mariadb-alpine:latest
    environment:
      MYSQL_ROOT_PASSWORD: $MYSQL_PASSWORD
    networks:
      pf:
        aliases:
          - "$MYSQL_HOST"
    volumes:
      - db_data:/var/lib/mysql
      - ./pathfinder/export/sql/eve_universe.sql.zip:/eve_universe.sql.zip
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: always

  pf-redis:
    image: redis:6.2.5-alpine3.14
    command: ["redis-server", "--appendonly", "yes"]
    container_name: redis
    volumes:
      - redis_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      pf:
        aliases:
          - "$REDIS_HOST"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: always

  pf-socket:
    build:
      context: .
      dockerfile: pf-websocket.Dockerfile
    command: ["--tcpHost", "0.0.0.0"]
    container_name: socket
    networks:
      pf:
        aliases:
          - "$PATHFINDER_SOCKET_HOST"
    volumes:
      - ./logs:/var/www/html/pathfinder/history/map
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: always

  pf:
    container_name: pathfinder
    build:
      context: .
      dockerfile: pathfinder.Dockerfile
    env_file:
      - .env
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - pf
    healthcheck:
      disable: true
    volumes:
      - ./config/pathfinder/config.ini:/var/www/html/pathfinder/app/templateConfig.ini
      - ./config/pathfinder/pathfinder.ini:/var/www/html/pathfinder/app/pathfinder.ini
      - ./config/pathfinder/plugin.ini:/var/www/html/pathfinder/app/plugin.ini
      - ./logs:/var/www/html/pathfinder/history/map
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - pfdb
      - pf-redis
      - pf-socket
    restart: always

volumes:
  db_data:
  redis_data:

networks:
  pf:
